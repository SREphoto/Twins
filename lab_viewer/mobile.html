<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ChemMate Grand Lab · Mobile Eco Mode</title>
  <meta http-equiv="refresh" content="0; url=index.html?mobile=1">
  <style>
    body {
      margin: 0;
      background: #0a0e14;
      color: #00f0ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(0, 240, 255, 0.2);
      border-top-color: #00f0ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      margin: 0 0 8px 0;
      font-size: 20px;
      letter-spacing: 0.5px;
    }
    p {
      color: #8fa3b8;
      font-size: 13px;
      max-width: 320px;
      line-height: 1.5;
      margin: 0 0 20px 0;
    }
    a {
      color: #00ffaa;
      text-decoration: none;
      font-weight: bold;
      border: 1px solid #00ffaa;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      display: inline-block;
      transition: background 0.2s;
    }
    a:active {
      background: rgba(0, 255, 170, 0.2);
    }
  </style>
  <script>
    localStorage.setItem("sre_lab_mobile_mode", "1");
    window.location.replace("index.html?mobile=1");
  </script>
</head>
<body>
  <div class="spinner"></div>
  <h2>Launching Mobile Eco Lab...</h2>
  <p>Initializing lightweight VRAM profile (zero exterior cars, on-demand instrument mounting).</p>
  <a href="index.html?mobile=1">Tap to Enter Mobile Lab</a>
</body>
</html>
